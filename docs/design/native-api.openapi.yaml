openapi: 3.1.0
info:
  title: fga native storage API
  version: "1"
  description: >
    Contract for the native storage operations (CNT-009), R1-B plus the R1-C
    labels and approvals. Rules that the schema cannot express are in
    native-api.md and labels-and-approvals.md. Every operation requires a
    bearer access token for the serving role's audience. An operation a
    policy allows only with an approval answers 202 APPROVAL_REQUIRED; it is
    repeated with the approval's ID in the Fga-Approval header.
servers:
  - url: http://127.0.0.1:8441
    description: storage role, development profile
  - url: http://127.0.0.1:8442
    description: keys role, development profile
security:
  - bearer: []
paths:
  /v1/buckets/{bucket}/uploads:
    post:
      operationId: beginEncryptedUpload
      parameters: [{ $ref: "#/components/parameters/bucket" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BeginRequest" }
      responses:
        "201": { description: Intent created, content: { application/json: { schema: { $ref: "#/components/schemas/Intent" } } } }
        "200": { description: Identical retry, content: { application/json: { schema: { $ref: "#/components/schemas/Intent" } } } }
        default: { $ref: "#/components/responses/Error" }
  /v1/uploads/{intent}/ciphertext:
    put:
      operationId: uploadCiphertext
      parameters:
        - { name: intent, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Content-Length, in: header, required: true, schema: { type: integer, minimum: 1 } }
        - { name: Fga-Ciphertext-Sha256, in: header, required: true, schema: { $ref: "#/components/schemas/Digest" } }
      requestBody:
        required: true
        content: { application/octet-stream: { schema: { type: string, format: binary } } }
      responses:
        "200": { description: Durable receipt, content: { application/json: { schema: { $ref: "#/components/schemas/Receipt" } } } }
        default: { $ref: "#/components/responses/Error" }
  /v1/uploads/{intent}/finalize:
    post:
      operationId: finalizeEncryptedUpload
      parameters:
        - { name: intent, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/FinalizeRequest" } } }
      responses:
        "200": { description: Published, content: { application/json: { schema: { $ref: "#/components/schemas/Published" } } } }
        "202": { $ref: "#/components/responses/ApprovalRequired" }
        default: { $ref: "#/components/responses/Error" }
  /v1/buckets/{bucket}/object:
    put:
      operationId: putServerObject
      description: Uploads plaintext to a server-mode bucket (D-12, SSE-005). The storage role encrypts it under a data key the keys role seals for the upload; the body length must be known. A client-mode bucket answers 409 ENCRYPTION_MODE.
      parameters:
        - { $ref: "#/components/parameters/bucket" }
        - { $ref: "#/components/parameters/key" }
        - { $ref: "#/components/parameters/approval" }
        - { name: Idempotency-Key, in: header, schema: { type: string, maxLength: 128 } }
        - { name: If-Match, in: header, schema: { type: string } }
        - { name: If-None-Match, in: header, schema: { type: string, enum: ["*"] } }
        - { name: Fga-Label, in: header, description: Explicit label of a new key, schema: { type: string, maxLength: 64 } }
      requestBody:
        required: true
        content: { application/octet-stream: { schema: { type: string, format: binary } } }
      responses:
        "200": { description: Published, content: { application/json: { schema: { $ref: "#/components/schemas/Published" } } } }
        "202": { $ref: "#/components/responses/ApprovalRequired" }
        default: { $ref: "#/components/responses/Error" }
    get:
      operationId: statObject
      parameters: [{ $ref: "#/components/parameters/bucket" }, { $ref: "#/components/parameters/key" }, { $ref: "#/components/parameters/version" }]
      responses:
        "200": { description: Permitted metadata, content: { application/json: { schema: { $ref: "#/components/schemas/VersionInfo" } } } }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteObject
      description: Without version, writes a delete marker. With version, withdraws that version.
      parameters: [{ $ref: "#/components/parameters/bucket" }, { $ref: "#/components/parameters/key" }, { $ref: "#/components/parameters/version" },
                   { $ref: "#/components/parameters/approval" }]
      responses:
        "200": { description: Deleted, content: { application/json: { schema: { $ref: "#/components/schemas/DeleteOutcome" } } } }
        "202": { $ref: "#/components/responses/ApprovalRequired" }
        default: { $ref: "#/components/responses/Error" }
  /v1/buckets/{bucket}/object/content:
    get:
      operationId: readServerObject
      description: The plaintext of a server-mode version, decrypted under the data key the keys role releases for this read (SSE-003). A failed stream is aborted, never completed short.
      parameters: [{ $ref: "#/components/parameters/bucket" }, { $ref: "#/components/parameters/key" }, { $ref: "#/components/parameters/version" }]
      responses:
        "200": { description: Plaintext, content: { application/octet-stream: { schema: { type: string, format: binary } } } }
        default: { $ref: "#/components/responses/Error" }
  /v1/buckets/{bucket}/object/export:
    get:
      operationId: exportServerObject
      description: The plaintext of a server-mode version under the export permission.
      parameters: [{ $ref: "#/components/parameters/bucket" }, { $ref: "#/components/parameters/key" }, { $ref: "#/components/parameters/version" }]
      responses:
        "200": { description: Plaintext, content: { application/octet-stream: { schema: { type: string, format: binary } } } }
        default: { $ref: "#/components/responses/Error" }
  /v1/buckets/{bucket}/encryption:
    get:
      operationId: getBucketEncryption
      description: The bucket's encryption mode, for a caller who may list the bucket.
      parameters: [{ $ref: "#/components/parameters/bucket" }]
      responses:
        "200": { description: Mode, content: { application/json: { schema: { $ref: "#/components/schemas/EncryptionRequest" } } } }
        default: { $ref: "#/components/responses/Error" }
    put:
      operationId: setBucketEncryption
      description: Changes the bucket's encryption mode (server or client) for uploads begun afterwards (ENC-001). Needs manage on the bucket; a policy may require an approval. Open uploads and existing versions keep their mode.
      parameters: [{ $ref: "#/components/parameters/bucket" }, { $ref: "#/components/parameters/approval" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/EncryptionRequest" } } }
      responses:
        "200": { description: Mode set, content: { application/json: { schema: { $ref: "#/components/schemas/EncryptionOutcome" } } } }
        "202": { $ref: "#/components/responses/ApprovalRequired" }
        default: { $ref: "#/components/responses/Error" }
  /v1/buckets/{bucket}/object/label:
    put:
      operationId: setLabel
      description: Raising (or keeping) the label needs label; lowering it needs relabel. Never outside the label order or below the bucket's floor.
      parameters: [{ $ref: "#/components/parameters/bucket" }, { $ref: "#/components/parameters/key" }, { $ref: "#/components/parameters/approval" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/LabelRequest" } } }
      responses:
        "200": { description: Label set, content: { application/json: { schema: { $ref: "#/components/schemas/LabelOutcome" } } } }
        "202": { $ref: "#/components/responses/ApprovalRequired" }
        default: { $ref: "#/components/responses/Error" }
  /v1/buckets/{bucket}/object/label-proposals:
    post:
      operationId: proposeLabel
      description: Records an advisory classifier proposal; never changes the label.
      parameters: [{ $ref: "#/components/parameters/bucket" }, { $ref: "#/components/parameters/key" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ProposalRequest" } } }
      responses:
        "201": { description: Recorded, content: { application/json: { schema: { $ref: "#/components/schemas/Proposal" } } } }
        default: { $ref: "#/components/responses/Error" }
  /v1/buckets/{bucket}/documents:
    post:
      operationId: beginDocument
      description: Reserves a document version; one unit intent per new unit, staged with uploadCiphertext.
      parameters: [{ $ref: "#/components/parameters/bucket" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [key, idempotency_key, units]
              properties:
                key: { type: string }
                idempotency_key: { type: string, minLength: 1, maxLength: 128 }
                units:
                  type: array
                  minItems: 1
                  maxItems: 1000
                  items:
                    type: object
                    additionalProperties: false
                    properties:
                      reuse_unit: { type: string, format: uuid }
                      reuse_version: { type: string, format: uuid }
                      label: { type: string, maxLength: 64 }
                original: { type: boolean, description: Reserve an encrypted original file (CNT-003) }
      responses:
        "201": { description: Document intent (document, version, units with intents and identifiers), content: { application/json: { schema: { type: object } } } }
        default: { $ref: "#/components/responses/Error" }
  /v1/document-uploads/{intent}/finalize:
    post:
      operationId: finalizeDocument
      description: Publishes the document version with its signed manifest and, per unit in manifest order, its descriptor and profile-2 envelopes. Body up to 48 MiB.
      parameters: [{ name: intent, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [manifest, manifest_signature, units]
              properties:
                manifest: { $ref: "#/components/schemas/Base64" }
                manifest_signature: { type: string }
                units:
                  type: array
                  items:
                    type: object
                    additionalProperties: false
                    required: [descriptor, descriptor_signature, envelopes]
                    properties:
                      descriptor: { $ref: "#/components/schemas/Base64" }
                      descriptor_signature: { type: string }
                      envelopes: { type: array, items: { $ref: "#/components/schemas/Envelope" } }
                original:
                  type: object
                  description: The original's object descriptor and profile-2 envelopes, when reserved
                  properties:
                    descriptor: { $ref: "#/components/schemas/Base64" }
                    descriptor_signature: { type: string }
                    envelopes: { type: array, items: { $ref: "#/components/schemas/Envelope" } }
      responses:
        "200":
          description: Published
          content:
            application/json:
              schema:
                type: object
                properties:
                  document_id: { type: string, format: uuid }
                  document_version_id: { type: string, format: uuid }
                  manifest_digest: { $ref: "#/components/schemas/Digest" }
                  generation: { type: integer }
                  units: { type: integer }
        default: { $ref: "#/components/responses/Error" }
  /v1/buckets/{bucket}/document/units/select:
    post:
      operationId: selectUnits
      description: Explicit unit selection; all named units or a generic NOT_FOUND.
      parameters: [{ $ref: "#/components/parameters/bucket" }, { $ref: "#/components/parameters/key" }, { $ref: "#/components/parameters/version" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [unit_ids], properties: { unit_ids: { type: array, minItems: 1, maxItems: 100, items: { type: string, format: uuid } } } }
      responses:
        "200": { description: Units, content: { application/json: { schema: { $ref: "#/components/schemas/UnitPage" } } } }
        default: { $ref: "#/components/responses/Error" }
  /v1/buckets/{bucket}/document/units:
    get:
      operationId: listUnits
      description: Authorized subset in document order; no positions or totals.
      parameters: [{ $ref: "#/components/parameters/bucket" }, { $ref: "#/components/parameters/key" }, { $ref: "#/components/parameters/version" },
                   { $ref: "#/components/parameters/limit" }, { $ref: "#/components/parameters/continuation" }]
      responses:
        "200": { description: Page, content: { application/json: { schema: { $ref: "#/components/schemas/UnitPage" } } } }
        default: { $ref: "#/components/responses/Error" }
  /v1/buckets/{bucket}/document/manifest:
    get:
      operationId: getManifest
      parameters: [{ $ref: "#/components/parameters/bucket" }, { $ref: "#/components/parameters/key" }, { $ref: "#/components/parameters/version" }]
      responses:
        "200":
          description: The signed manifest, only when every unit may be disclosed
          content: { application/json: { schema: { type: object, properties: { manifest: { $ref: "#/components/schemas/Base64" }, manifest_signature: { type: string } } } } }
        default: { $ref: "#/components/responses/Error" }
  /v1/buckets/{bucket}/document/unit/package:
    get:
      operationId: getUnitPackage
      parameters: [{ $ref: "#/components/parameters/bucket" }, { $ref: "#/components/parameters/key" }, { $ref: "#/components/parameters/version" },
                   { name: unit, in: query, required: true, schema: { type: string, format: uuid } },
                   { name: recipient, in: query, required: true, schema: { $ref: "#/components/schemas/Digest" } }]
      responses:
        "200": { description: Descriptor and the recipient's envelope with a receipt, content: { application/json: { schema: { type: object } } } }
        default: { $ref: "#/components/responses/Error" }
  /v1/buckets/{bucket}/document/unit/ciphertext:
    get:
      operationId: getUnitCiphertext
      parameters: [{ $ref: "#/components/parameters/bucket" }, { $ref: "#/components/parameters/key" }, { $ref: "#/components/parameters/version" },
                   { name: unit, in: query, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: The unit's exact ciphertext, content: { application/octet-stream: { schema: { type: string, format: binary } } } }
        default: { $ref: "#/components/responses/Error" }
  /v1/buckets/{bucket}/document/original/package:
    get:
      operationId: getOriginalPackage
      description: The original file's descriptor and the recipient's envelope; needs raw-read on the version and read on every unit.
      parameters: [{ $ref: "#/components/parameters/bucket" }, { $ref: "#/components/parameters/key" }, { $ref: "#/components/parameters/version" },
                   { name: recipient, in: query, required: true, schema: { $ref: "#/components/schemas/Digest" } }]
      responses:
        "200": { description: Package, content: { application/json: { schema: { $ref: "#/components/schemas/Package" } } } }
        default: { $ref: "#/components/responses/Error" }
  /v1/buckets/{bucket}/document/original/ciphertext:
    get:
      operationId: getOriginalCiphertext
      parameters: [{ $ref: "#/components/parameters/bucket" }, { $ref: "#/components/parameters/key" }, { $ref: "#/components/parameters/version" }]
      responses:
        "200": { description: The original's exact ciphertext, content: { application/octet-stream: { schema: { type: string, format: binary } } } }
        default: { $ref: "#/components/responses/Error" }
  /v1/buckets/{bucket}/derived/package:
    get:
      operationId: getDerivedPackage
      description: A derived output's descriptor and the caller's envelope; needs deliver and the recipient's read on the whole lineage, or declassify.
      parameters: [{ $ref: "#/components/parameters/bucket" }, { $ref: "#/components/parameters/key" }, { $ref: "#/components/parameters/version" },
                   { name: recipient, in: query, required: true, schema: { $ref: "#/components/schemas/Digest" } }]
      responses:
        "200": { description: Package, content: { application/json: { schema: { $ref: "#/components/schemas/Package" } } } }
        default: { $ref: "#/components/responses/Error" }
  /v1/buckets/{bucket}/derived/ciphertext:
    get:
      operationId: getDerivedCiphertext
      description: Ends with an aborted body (LINEAGE_AUTHORITY_CHANGED) when a lineage source changes during the stream.
      parameters: [{ $ref: "#/components/parameters/bucket" }, { $ref: "#/components/parameters/key" }, { $ref: "#/components/parameters/version" },
                   { name: recipient, in: query, required: true, schema: { $ref: "#/components/schemas/Digest" } }]
      responses:
        "200": { description: The derived version's exact ciphertext, content: { application/octet-stream: { schema: { type: string, format: binary } } } }
        default: { $ref: "#/components/responses/Error" }
  /v1/buckets/{bucket}/derived/envelopes:
    post:
      operationId: shareDerived
      parameters: [{ $ref: "#/components/parameters/bucket" }, { $ref: "#/components/parameters/key" },
                   { name: version, in: query, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/Envelope" } } }
      responses:
        "201": { description: Shared, content: { application/json: { schema: { $ref: "#/components/schemas/EnvelopeRef" } } } }
        default: { $ref: "#/components/responses/Error" }
  /v1/buckets/{bucket}/document/export:
    post:
      operationId: exportUnits
      description: Encrypted export of units for a target recipient that already has envelopes; generic NOT_FOUND on any denial.
      parameters: [{ $ref: "#/components/parameters/bucket" }, { $ref: "#/components/parameters/key" }, { $ref: "#/components/parameters/version" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [unit_ids, recipient]
              properties:
                unit_ids: { type: array, minItems: 1, maxItems: 100, items: { type: string, format: uuid } }
                recipient: { $ref: "#/components/schemas/Digest" }
      responses:
        "200": { description: Export package (descriptors, ciphertext, the target's envelopes and receipts), content: { application/json: { schema: { type: object } } } }
        default: { $ref: "#/components/responses/Error" }
  /v1/buckets/{bucket}/documents/search:
    get:
      operationId: searchDocuments
      parameters:
        - { $ref: "#/components/parameters/bucket" }
        - { name: prefix, in: query, schema: { type: string } }
        - { name: project, in: query, schema: { type: string } }
        - { name: max_label, in: query, schema: { type: string } }
        - { $ref: "#/components/parameters/limit" }
        - { $ref: "#/components/parameters/continuation" }
      responses:
        "200": { description: Discoverable documents in key order; no totals, content: { application/json: { schema: { type: object } } } }
        default: { $ref: "#/components/responses/Error" }
  /v1/approvals:
    get:
      operationId: listApprovals
      description: Pending approvals the caller may decide (approve on the target), excluding its own requests.
      parameters:
        - { name: after, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 100 } }
      responses:
        "200": { description: Page, content: { application/json: { schema: { $ref: "#/components/schemas/ApprovalPage" } } } }
        default: { $ref: "#/components/responses/Error" }
  /v1/approvals/{id}:
    post:
      operationId: decideApproval
      parameters: [{ name: id, in: path, required: true, schema: { type: string, maxLength: 64 } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [decision], properties: { decision: { type: string, enum: [approve, reject] } } }
      responses:
        "200": { description: Decided, content: { application/json: { schema: { $ref: "#/components/schemas/Approval" } } } }
        default: { $ref: "#/components/responses/Error" }
  /v1/buckets/{bucket}/object/package:
    get:
      operationId: readPackage
      parameters:
        - { $ref: "#/components/parameters/bucket" }
        - { $ref: "#/components/parameters/key" }
        - { $ref: "#/components/parameters/version" }
        - { name: recipient, in: query, required: true, schema: { $ref: "#/components/schemas/Digest" } }
      responses:
        "200": { description: Encrypted package metadata, content: { application/json: { schema: { $ref: "#/components/schemas/Package" } } } }
        default: { $ref: "#/components/responses/Error" }
  /v1/buckets/{bucket}/object/ciphertext:
    get:
      operationId: readCiphertext
      parameters: [{ $ref: "#/components/parameters/bucket" }, { $ref: "#/components/parameters/key" }, { $ref: "#/components/parameters/version" }]
      responses:
        "200":
          description: Exact ciphertext of the version
          headers:
            Fga-Version-Id: { schema: { type: string, format: uuid } }
            Fga-Ciphertext-Sha256: { schema: { $ref: "#/components/schemas/Digest" } }
          content: { application/octet-stream: { schema: { type: string, format: binary } } }
        default: { $ref: "#/components/responses/Error" }
  /v1/buckets/{bucket}/objects:
    get:
      operationId: listObjects
      parameters:
        - { $ref: "#/components/parameters/bucket" }
        - { name: prefix, in: query, schema: { type: string } }
        - { $ref: "#/components/parameters/limit" }
        - { $ref: "#/components/parameters/continuation" }
      responses:
        "200": { description: Visible entries, content: { application/json: { schema: { $ref: "#/components/schemas/ObjectPage" } } } }
        default: { $ref: "#/components/responses/Error" }
  /v1/buckets/{bucket}/object/versions:
    get:
      operationId: listVersions
      parameters: [{ $ref: "#/components/parameters/bucket" }, { $ref: "#/components/parameters/key" }, { $ref: "#/components/parameters/limit" }, { $ref: "#/components/parameters/continuation" }]
      responses:
        "200": { description: Visible versions, content: { application/json: { schema: { $ref: "#/components/schemas/VersionPage" } } } }
        default: { $ref: "#/components/responses/Error" }
  /v1/recipients:
    post:
      operationId: enrollRecipient
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/EnrollRequest" } } } }
      responses:
        "201": { description: Challenge, content: { application/json: { schema: { $ref: "#/components/schemas/Challenge" } } } }
        default: { $ref: "#/components/responses/Error" }
  /v1/recipients/{fingerprint}:
    get:
      operationId: getRecipient
      parameters: [{ $ref: "#/components/parameters/fingerprint" }]
      responses:
        "200": { description: Directory entry (not a trust anchor), content: { application/json: { schema: { $ref: "#/components/schemas/KeyRecord" } } } }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: revokeRecipient
      parameters: [{ $ref: "#/components/parameters/fingerprint" }]
      responses:
        "200": { description: Revoked, content: { application/json: { schema: { $ref: "#/components/schemas/KeyRecord" } } } }
        default: { $ref: "#/components/responses/Error" }
  /v1/recipients/{fingerprint}/activate:
    post:
      operationId: activateRecipient
      parameters: [{ $ref: "#/components/parameters/fingerprint" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ProofRequest" } } } }
      responses:
        "200": { description: Active, content: { application/json: { schema: { $ref: "#/components/schemas/KeyRecord" } } } }
        default: { $ref: "#/components/responses/Error" }
  /v1/signing-keys/{fingerprint}:
    get:
      operationId: getSigningKey
      parameters: [{ $ref: "#/components/parameters/fingerprint" }]
      responses:
        "200": { description: Verification record, content: { application/json: { schema: { $ref: "#/components/schemas/KeyRecord" } } } }
        default: { $ref: "#/components/responses/Error" }
  /v1/envelopes:
    post:
      operationId: publishRecipientEnvelope
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ShareRequest" } } } }
      responses:
        "201": { description: Published, content: { application/json: { schema: { $ref: "#/components/schemas/EnvelopeRef" } } } }
        default: { $ref: "#/components/responses/Error" }
  /v1/envelopes/{id}:
    delete:
      operationId: retireEnvelope
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Retired, content: { application/json: { schema: { $ref: "#/components/schemas/EnvelopeRef" } } } }
        default: { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: at+jwt }
  parameters:
    bucket: { name: bucket, in: path, required: true, schema: { type: string, pattern: "^[a-z0-9][a-z0-9-]{2,62}$" } }
    key: { name: key, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 1024 } }
    version: { name: version, in: query, schema: { type: string, format: uuid } }
    limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 100 } }
    continuation: { name: continuation, in: query, schema: { type: string } }
    fingerprint: { name: fingerprint, in: path, required: true, schema: { $ref: "#/components/schemas/Digest" } }
    approval: { name: Fga-Approval, in: header, description: The approval presented when repeating an operation that needed one, schema: { type: string, maxLength: 64 } }
  responses:
    ApprovalRequired:
      description: Every check allows the operation once an approval is given
      content:
        application/json:
          schema:
            type: object
            required: [status, approval_id]
            properties:
              status: { type: string, enum: [APPROVAL_REQUIRED] }
              approval_id: { type: string }
              intent_id: { type: string, format: uuid, description: The staged server-mode upload to finalize once approved }
    Error:
      description: Redacted error
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [error]
            properties:
              error: { type: string, enum: [INVALID_REQUEST, UNAUTHENTICATED, NOT_FOUND, CONFLICT, PRECONDITION_FAILED, TOO_LARGE, OVERLOADED, UNAVAILABLE, APPROVAL_NOT_USABLE, ENCRYPTION_MODE] }
  schemas:
    Digest: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
    Base64: { type: string, contentEncoding: base64 }
    BeginRequest:
      type: object
      additionalProperties: false
      required: [key, idempotency_key]
      properties:
        key: { type: string }
        idempotency_key: { type: string, minLength: 1, maxLength: 128 }
        if_match: { type: string }
        if_none_match: { type: string, enum: ["*"] }
        label: { type: string, maxLength: 64, description: Explicit label of a new key; needs label on the planned object }
        derived: { type: boolean, description: Begin a derived output; finalize then carries lineage and lineage_signature }
    Intent:
      type: object
      properties:
        intent_id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        object_id: { type: string, format: uuid }
        logical_version_id: { type: string, format: uuid }
        crypto_version_id: { type: string, format: uuid }
        blob_id: { type: string, format: uuid }
        attempt_id: { type: string, format: uuid }
        suite: { type: integer }
        format: { type: integer }
        max_ciphertext_length: { type: integer }
        expires_at: { type: string, format: date-time }
    Receipt:
      type: object
      properties:
        blob_id: { type: string, format: uuid }
        ciphertext_length: { type: integer }
        ciphertext_sha256: { $ref: "#/components/schemas/Digest" }
    Envelope:
      type: object
      additionalProperties: false
      required: [context, ciphertext, signature]
      properties:
        context: { $ref: "#/components/schemas/Base64" }
        ciphertext: { $ref: "#/components/schemas/Base64" }
        signature: { type: string, description: detached compact JWS }
    FinalizeRequest:
      type: object
      additionalProperties: false
      required: [descriptor, descriptor_signature, envelopes]
      properties:
        descriptor: { $ref: "#/components/schemas/Base64" }
        descriptor_signature: { type: string }
        envelopes: { type: array, minItems: 1, maxItems: 16, items: { $ref: "#/components/schemas/Envelope" } }
    Published:
      type: object
      properties:
        object_id: { type: string, format: uuid }
        version_id: { type: string, format: uuid }
        etag: { type: string }
        generation: { type: integer }
    VersionInfo:
      type: object
      properties:
        version_id: { type: string, format: uuid }
        etag: { type: string }
        current: { type: boolean }
        ciphertext_length: { type: integer }
        ciphertext_sha256: { $ref: "#/components/schemas/Digest" }
        suite: { type: integer }
        format: { type: integer }
        created_at: { type: string, format: date-time }
        encryption: { type: string, enum: [server, client] }
        length: { type: integer, description: Plaintext length of a server-mode version }
    Package:
      type: object
      properties:
        version: { $ref: "#/components/schemas/VersionInfo" }
        descriptor: { $ref: "#/components/schemas/Base64" }
        descriptor_signature: { type: string }
        envelope_id: { type: string, format: uuid }
        envelope: { $ref: "#/components/schemas/Envelope" }
        receipt: { $ref: "#/components/schemas/Base64" }
        receipt_signature: { type: string }
    ObjectPage:
      type: object
      properties:
        entries:
          type: array
          items:
            type: object
            properties:
              key: { type: string }
              version_id: { type: string, format: uuid }
              ciphertext_length: { type: integer }
              created_at: { type: string, format: date-time }
        continuation: { type: string }
    VersionPage:
      type: object
      properties:
        versions:
          type: array
          items:
            type: object
            properties:
              version_id: { type: string, format: uuid }
              current: { type: boolean }
              delete_marker: { type: boolean }
              created_at: { type: string, format: date-time }
        continuation: { type: string }
    DeleteOutcome:
      type: object
      properties:
        generation: { type: integer }
        version_id: { type: string, format: uuid }
        state: { type: string, enum: [DELETE_MARKER, WITHDRAWN] }
    EnrollRequest:
      type: object
      additionalProperties: false
      required: [public_key]
      properties:
        public_key: { $ref: "#/components/schemas/Base64" }
    Challenge:
      type: object
      properties:
        challenge_id: { type: string, format: uuid }
        fingerprint: { $ref: "#/components/schemas/Digest" }
        nonce: { $ref: "#/components/schemas/Base64" }
        ephemeral_public_key: { $ref: "#/components/schemas/Base64" }
        expires_at: { type: string, format: date-time }
    ProofRequest:
      type: object
      additionalProperties: false
      required: [challenge_id, proof]
      properties:
        challenge_id: { type: string, format: uuid }
        proof: { type: string, description: base64 HMAC for a recipient key, compact JWS for a signing key }
    KeyRecord:
      type: object
      properties:
        fingerprint: { $ref: "#/components/schemas/Digest" }
        principal: { type: string }
        public_key: { $ref: "#/components/schemas/Base64" }
        key_version: { type: integer }
        status: { type: string, enum: [PENDING, ACTIVE, REVOKED, RETIRED, COMPROMISED] }
        revision: { type: integer }
    ShareRequest:
      type: object
      additionalProperties: false
      required: [bucket, key, version, envelope]
      properties:
        bucket: { type: string }
        key: { type: string }
        version: { type: string, format: uuid }
        envelope: { $ref: "#/components/schemas/Envelope" }
    EnvelopeRef:
      type: object
      properties:
        envelope_id: { type: string, format: uuid }
        generation: { type: integer }
        status: { type: string, enum: [ACTIVE, RETIRED] }
    LabelRequest:
      type: object
      additionalProperties: false
      required: [label]
      properties:
        label: { type: string, minLength: 1, maxLength: 64 }
    LabelOutcome:
      type: object
      properties:
        object_id: { type: string, format: uuid }
        label: { type: string }
        previous_label: { type: string }
        metadata_revision: { type: integer }
    EncryptionRequest:
      type: object
      additionalProperties: false
      required: [encryption]
      properties:
        encryption: { type: string, enum: [server, client] }
    EncryptionOutcome:
      type: object
      properties:
        bucket_id: { type: string, format: uuid }
        encryption: { type: string, enum: [server, client] }
        previous_encryption: { type: string, enum: [server, client] }
        metadata_revision: { type: integer }
    ProposalRequest:
      type: object
      additionalProperties: false
      required: [label, classifier]
      properties:
        label: { type: string, minLength: 1, maxLength: 64 }
        classifier: { type: string, minLength: 1, maxLength: 128 }
    Proposal:
      type: object
      properties:
        proposal_id: { type: string, format: uuid }
        resource_type: { type: string }
        resource_id: { type: string }
        label: { type: string }
        classifier: { type: string }
        proposer: { type: string }
        authoritative: { type: boolean, const: false }
        created_at: { type: string, format: date-time }
    Approval:
      type: object
      properties:
        approval_id: { type: string }
        operation: { type: string }
        plan: { type: object, description: The platform-rendered plan (opplan.Summary) the approval binds }
        requested_by: { type: string }
        state: { type: string, enum: [PENDING, APPROVED, REJECTED, CONSUMED] }
        expires_at: { type: string, format: date-time }
    ApprovalPage:
      type: object
      properties:
        approvals: { type: array, items: { $ref: "#/components/schemas/Approval" } }
        next: { type: string }
    UnitPage:
      type: object
      properties:
        units:
          type: array
          items:
            type: object
            properties:
              unit_id: { type: string, format: uuid }
              unit_version_id: { type: string, format: uuid }
              ciphertext_length: { type: integer }
              descriptor: { $ref: "#/components/schemas/Base64" }
              descriptor_signature: { type: string }
        continuation: { type: string }
